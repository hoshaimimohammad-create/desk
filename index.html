<style>
/* Layout: a phone-first dispatch desk. Sticky header with tabs, then one working list. Paper-slip rows with a status pill per waybill. */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#18232b; --muted:#5d6b75; --line:#d6dde2;
  --accent:#0b6e8a; --accent-ink:#ffffff; --accent-soft:#dcedf2;
  --ok:#1f7a45; --ok-soft:#dcf1e4; --warn:#9a5b00; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#f9dedc; --wait:#5d6b75; --wait-soft:#e6eaed;
  --flag:#fff3b0; --flag-ink:#5c4a00;
  --f-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-display:"Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101619; --panel:#172126; --ink:#e4ebef; --muted:#97a6af; --line:#2a373e;
  --accent:#4fb6d3; --accent-ink:#06222b; --accent-soft:#163540;
  --ok:#6fd39a; --ok-soft:#173a27; --warn:#f0b65a; --warn-soft:#3b2c12; --bad:#ff8c84; --bad-soft:#47201d; --wait:#a5b2ba; --wait-soft:#243036;
  --flag:#4a3f0c; --flag-ink:#ffe680; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101619; --panel:#172126; --ink:#e4ebef; --muted:#97a6af; --line:#2a373e;
  --accent:#4fb6d3; --accent-ink:#06222b; --accent-soft:#163540;
  --ok:#6fd39a; --ok-soft:#173a27; --warn:#f0b65a; --warn-soft:#3b2c12; --bad:#ff8c84; --bad-soft:#47201d; --wait:#a5b2ba; --wait-soft:#243036;
  --flag:#4a3f0c; --flag-ink:#ffe680; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 0;display:grid;gap:8px;position:relative}.bk-row{position:absolute;top:10px;inset-inline-end:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}.brand.wfp{margin:0!important}.brand.wfp img{max-width:calc(50vw - 40px)}
.brand{display:flex;width:fit-content;background:#fff;border-radius:6px;padding:3px 6px;margin-bottom:4px}.brand img{display:block;height:40px;width:auto;max-width:calc(50vw - 40px);object-fit:contain}
.brand{margin-bottom:8px!important}
h1{line-height:1.6}
h1{font-family:var(--f-display);font-size:1.35rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.82rem;margin:0}
nav{display:flex;flex-wrap:wrap;gap:2px 4px}
nav button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 .95rem var(--f-body);padding:7px 10px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main .wrap{padding-block:14px 60px;display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 .88rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font:600 .9rem var(--f-body);cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 1.4rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)}
.group{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--accent-soft)}
.ghead h3{margin:0;font-size:1rem}
.ghead .meta{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.row .nm{min-width:0}
.row .nm>b{font-weight:600;display:block;margin-bottom:3px}
.row .nm>.tag{margin-inline-start:0}
.row .nm small{display:block;color:var(--muted);font-size:.78rem}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.row{grid-template-columns:minmax(0,1fr)}.pills{justify-content:flex-start}}
select.st:disabled{opacity:1;cursor:default;-webkit-appearance:none;appearance:none;background-image:none}
.tag{font-size:.72rem;border-radius:5px;padding:1px 6px;margin-inline-start:6px;vertical-align:middle;background:var(--wait-soft);color:var(--muted)}
.tag.snack{background:var(--accent-soft);color:var(--accent)}
.lbl{font-size:.7rem;color:var(--muted);display:block;margin-bottom:2px}
.alg-badge{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--warn);color:#fff;font-size:.75rem;font-weight:700}.alg-chip[aria-pressed="true"]{background:var(--warn);color:#fff;border-color:var(--warn)}
.err-badge{display:inline-block;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700}small.items.err{color:var(--bad);font-weight:600}.err-chip[aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}.search{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line,#ccc);border-radius:10px;font:inherit;background:var(--card,#fff);color:inherit;margin:4px 0 8px}
.kg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}.kg-grid label{display:flex;flex-direction:column;font-size:.85rem;gap:3px}.kg-grid input{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card,#fff);color:inherit}.po-set summary{cursor:pointer}
.pf-wrap{overflow-x:auto;margin:10px 0;border-radius:8px;border:1px solid var(--line)}
.pf{border-collapse:collapse;min-width:760px;width:100%;background:#fff;color:#000;font-size:.8rem;font-family:Calibri,Arial,sans-serif}
.pf td,.pf th{border:1px solid #000;padding:4px 6px;vertical-align:middle;text-align:center}
.pf th{background:#D9E1F2;font-weight:700}
.pf .pf-h th{background:#1F4E79;color:#fff}
.pf .pf-title{font-size:1.3rem;font-weight:700;padding:10px;position:relative}
.pf-logo{height:34px;position:absolute;inset-inline-end:8px;top:6px}
.pf .pf-desc{text-align:start;min-width:260px;line-height:1.35}
.pf .pf-small{font-size:.7rem;text-align:start}
.pf .pf-gap td{border:none;height:8px;background:#fff}
.pf .pf-sum th{background:#F2F2F2;text-align:start}
.pf .pf-sig td,.pf .pf-sig th{height:44px}
.pf tr.zero td{color:#999}.po-day.sel{outline:2px solid var(--accent);outline-offset:-2px}.warn-t{color:var(--warn);font-weight:600}.tbl{overflow-x:auto;direction:ltr}.tbl td:nth-child(2){min-width:150px}.tbl table{width:100%;border-collapse:collapse;font-size:.85rem}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}.tbl tr.zero td{opacity:.45}.tbl tr.sum td{font-weight:700}
.iss-tbl td{min-width:90px}.iss-tbl td:nth-child(4),.iss-tbl td:nth-child(5){min-width:220px}.iss-tbl textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit;background:var(--card,#fff);color:inherit}.iss-tbl .thumbs img{width:48px;height:48px}
.iss-box{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--wait-soft)}.iss-box b{display:block;font-size:.8rem;margin-bottom:2px}.iss-box.fix{background:var(--ok-soft)}.iss-box textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit;background:var(--card,#fff);color:inherit}
.wt-tbl input{width:100%;min-width:80px;box-sizing:border-box;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card,#fff);color:inherit}.wt-tbl td.n{text-align:right}
.scan-box{margin:8px 0}.vh{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}.scan-lbl{cursor:pointer;display:inline-flex;align-items:center}.scan-lbl.busy{opacity:.5;pointer-events:none}.scan-msg{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--wait-soft)}.scan-msg.ok{background:var(--ok-soft)}.scan-msg.warn{background:var(--bad-soft)}
.wbt-bar .chip[aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}
#view.searching .wb-top{display:none}
#view[data-tab="wb"] .nav-now{display:none}
.nav-now{font-size:.9rem;margin:2px 0 6px;color:var(--ink)}.nav-now b{color:var(--accent)}.mchip{font-weight:700}
small.items{display:block;color:var(--ink-2,inherit);opacity:.85}small.items.alg{color:var(--warn)}.alg-pills{grid-column:1/-1;margin-top:2px}
select.st{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:5px 12px;font:600 .82rem var(--f-body);cursor:pointer;min-width:98px;text-align:center}
.s-wait{background:var(--wait-soft);color:var(--wait)} .s-company,.s-driver{background:var(--warn-soft);color:var(--warn)}
.s-got,.s-done{background:var(--ok-soft);color:var(--ok)} .s-lost,.s-no{background:var(--bad-soft);color:var(--bad)}
.note-in{grid-column:1/-1;width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:4px 8px;font:400 .82rem var(--f-body)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.flag{background:var(--flag);color:var(--flag-ink);border-radius:8px;padding:8px 10px;font-size:.85rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.card h3{margin:0;font-size:1.02rem}
.phone{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;user-select:all}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
#view[data-tab="drv"] .grid2{align-items:start}
.dhd{display:flex;align-items:center;gap:10px}.dhd .chip{margin-inline-start:auto;flex:none}
.dnum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem}
.dwho{min-width:0}.dwho h3{margin:0;font-size:1.05rem;line-height:1.3}
.dtel{display:inline-block;margin-top:2px;color:var(--accent);text-decoration:none;font-size:.9rem}
.dmeta{margin:10px 0 0;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
ul.dl{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
ul.dl li{padding:7px 0;border-bottom:1px solid var(--line)}ul.dl li:last-child{border-bottom:0;padding-bottom:0}
ul.dl .sn{display:flex;gap:8px;align-items:baseline;font-size:.92rem;line-height:1.4}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:#9aa4ae}.dot.snack{background:var(--accent)}
ul.dl .am{display:block;color:var(--muted);font-size:.78rem;margin-inline-start:16px;margin-top:1px}
.dmove{margin-top:4px;margin-inline-start:16px;max-width:calc(100% - 16px)}
ul.plain{margin:0;padding:0;list-style:none;display:grid;gap:4px}
ul.plain li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem}
form.f{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
form.f .full{grid-column:1/-1}
label.fl{display:grid;gap:3px;font-size:.82rem;color:var(--muted)}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--ink);font:400 .95rem var(--f-body);width:100%}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.78rem}
td.n{font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.status-line{font-size:.8rem;color:var(--muted)}
#tabs:not(.ok){visibility:hidden}
body.ro #tabs button:not([data-tab="wb"]):not([data-tab="drv"]),body.ro #wkBackup,body.ro .scan-box,body.ro .sub-bar select,body.ro [data-editdrv],body.ro #sub{display:none!important}
body.ro select:disabled,body.ro input:disabled{opacity:1}
nav button.need::after,#wkBackup.need::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-inline-start:6px;vertical-align:middle}
.td-grid{grid-template-columns:repeat(3,1fr)}.tdc{text-align:start;font:inherit;color:inherit;cursor:pointer}.tdc small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}.tdc:hover{border-color:var(--accent)}
@media (max-width:520px){.td-grid{grid-template-columns:repeat(2,1fr)}}
.sub-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}.sub-bar:empty{display:none}.sub-bar select.chip{max-width:100%;font-size:.8rem;color:var(--muted)}.sub-bar .flag{padding:3px 8px;font-size:.8rem}
.sc-t{font-size:.78rem;padding:3px 8px;background:var(--bad-soft);color:var(--bad);margin:0}.sc-t.alg{background:var(--warn-soft);color:var(--warn)}
.hy-head{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hy-card{gap:0}.hy-sec{color:var(--accent);padding-bottom:8px}
.hy-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.hy-row.no{box-shadow:inset 3px 0 0 var(--bad);padding-inline-start:10px}
.hy-q{display:flex;gap:8px;min-width:0;line-height:1.4}.hy-q b{flex:none;min-width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.hy-head .wide{grid-column:span 2}
.hy-opts{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr)) auto;gap:6px}.hy-opts .hy-add{width:44px;background:transparent;border-style:dashed;font-size:1rem}
.hy-opts button{min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:600 .92rem var(--f-body);cursor:pointer}
.hy-opts button[aria-pressed="true"]{color:var(--panel)}
.hy-opts button[aria-pressed="true"][data-v="yes"]{background:var(--ok);border-color:var(--ok)}
.hy-opts button[aria-pressed="true"][data-v="no"]{background:var(--bad);border-color:var(--bad)}
.hy-opts button[aria-pressed="true"][data-v="na"]{background:var(--wait);border-color:var(--wait)}
.hy-c{grid-column:1/-1;width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:7px 9px;font:400 .88rem var(--f-body)}
@media (max-width:640px){.hy-row{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.88rem;z-index:20}
.issue{display:grid;gap:6px}
.issue .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tag.eta{background:var(--wait-soft);color:var(--ink,inherit);font-weight:600}
.sumt th,.sumt td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}.sumt td:first-child{text-align:left}
</style>

  order.forEach(g=>{
    let list=groups[g].slice().sort((a,b)=>seqOf(a.id)-seqOf(b.id));if(S.wbType)list=list.filter(r=>wbMiss(S.day,r,S.wbType));if(S.onlyMissing)list=list.filter(r=>isMissing(S.day,r.id));if(S.onlyAlg)list=list.filter(r=>(r.alg||0)>0);if(S.onlyErr)list=list.filter(r=>(r.err||[]).length);if(!list.length)return;

  ${m?`<div class="scan-msg ${m.ok?"ok":m.warn?"warn":""}">${m.html}</div>`:""}</div>`}
async function scanImg(file){
  const bm=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bm.width,bm.height));
  const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
  c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85))}
function scanLog(o){try{if(S.db)S.db.collection("scanlog").add(Object.assign({at:new Date().toISOString(),ua:navigator.userAgent.slice(0,120)},JSON.parse(JSON.stringify(o))))}catch(_){}}
function scanQtyCheck(r,alg,sn,ans){
  const got={};Object.entries((ans&&ans.items)||{}).forEach(([k,v])=>{const n=Math.round(parseFloat(String(v).replace(/,/g,"")));if(INAME[k]&&n>0)got[k]=n});

  if(alg)Object.assign(exp,ai);else Object.keys(it).forEach(k=>{const v=(it[k]||0)-(sn&&r.alg?(ai[k]||0):0);if(v>0)exp[k]=v});
  const ks=[...new Set([...Object.keys(exp),...Object.keys(got)])],diff=[];
  ks.forEach(k=>{const e=exp[k]||0,g=got[k]||0;if(e!==g&&!(!alg&&g===(it[k]||0)))diff.push(`${INAME[k]}: paper ${g} · tracker ${e}`)});

const QC_DEC=["Accepted for packing","Accepted with remarks","Rejected"];
function qcDate(s){const m=String(s||"").match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(!m)return "";const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}
function qcSplit(t){
  const lines=String(t||"").split("\n"),secs=[];let cur=null;
  lines.forEach(l=>{const m=l.match(/^\s*(\d{1,2})[.)\-]\s+(\S.*)$/);if(m&&!/:/.test(m[2])){cur={head:m[2].trim(),lines:[]};secs.push(cur)}else if(cur)cur.lines.push(l)});
  if(!secs.length)return [{head:"",text:t}];
  return secs.map(s=>({head:s.head,text:s.lines.join("\n")}))}
function qcParse(t){
  const o={product:"",qty:"",unit:"",prod:"",exp:"",weight:"",wunit:"",result:"",decision:"",date:"",extra:{}};
  const dec=s=>{const l=s.toLowerCase();return l.includes("reject")?"Rejected":(l.includes("remark")||l.includes("condition")||l.includes("hold"))?"Accepted with remarks":l.includes("accept")?"Accepted for packing":""};
  String(t||"").split(/\n+/).map(l=>l.replace(/^[\s*•\-–·>]+/,"").trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^([^:]{2,50}):\s*(.+)$/);
    if(!m){if(!o.decision&&dec(l)&&/accept|reject/i.test(l))o.decision=dec(l);return}
    const k=m[1].trim(),v=m[2].trim().replace(/\.$/,""),kl=k.toLowerCase();
    if(/product|item|material/.test(kl)&&!o.product)o.product=v;
    else if(/quantit|qty|sample/.test(kl)&&o.qty===""){o.qty=(v.match(/[\d.,]+/)||[""])[0].replace(/,/g,"");o.unit=v.replace(/[\d.,\s]+/,"").trim()||"units"}
    else if(/prod(uction)?\.? ?date|manufactur|mfg/.test(kl))o.prod=qcDate(v)||v;
    else if(/expir|exp\.? ?date|best before|use by/.test(kl))o.exp=qcDate(v)||v;
    else if(/weight/.test(kl)&&o.weight===""){o.weight=(v.match(/[\d.,]+/)||[""])[0];o.wunit=v.replace(/^[\d.,\s]+/,"").trim()||"g/unit"}
    else if(/result|observ|finding|defect/.test(kl)&&!o.result)o.result=v;
    else if(/decision|status|conclusion/.test(kl))o.decision=dec(v)||v;
    else if(/^(inspection )?date$|inspected on/.test(kl))o.date=qcDate(v)||"";
    else o.extra[k]=v});
  return o}
function qcItems(q){return q.items||[{product:q.product,qty:q.qty,unit:q.unit,prod:q.prod,exp:q.exp,weight:q.weight,wunit:q.wunit,result:q.result,decision:q.decision,extra:q.extra}]}

function qcExtra(it,re){const e=Object.entries(it.extra||{}).filter(([k])=>re.test(k));return e.map(([k,v])=>v).join("; ")}

  if(t.id==="q_cancel"){qcReset();return}
  const eq=t.closest("[data-editqc]");if(eq){const q=S.qc.find(x=>x._id===eq.dataset.editqc);if(!q)return;qcReset();S.editQc=q._id;$("#q_raw").value=q.raw||"";$("#q_note").value=q.note||"";$("#q_date").value=q.date||todayISO();$("#q_btn").textContent="Save changes";$("#q_cancel").hidden=false;$("#q_stat").textContent="Change the date or the text, then save. The text is read again.";$("#qcForm").scrollIntoView({behavior:"smooth"});return}

  if(t.id==="xlsQc"){const rows=[["HAND – WFP School Snacks Project – Raw Material Inspection"],[],["Distribution date","Packing date","#","Product","Qty inspected","Unit","Production date","Expiry date","Avg weight","Weight unit","Inspection result","Decision","Other details","Note"]];S.qc.filter(q=>!S.qcMonth||(q.date||"").startsWith(S.qcMonth)).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(q=>qcItems(q).forEach((it,i)=>rows.push([q.date,q.pack||"",i+1,it.product,it.qty,it.unit,it.prod,it.exp,it.weight,it.wunit,it.result,it.decision||q.decision||"",Object.entries(it.extra||{}).map(([k,v])=>k+": "+v).join("; "),q.note||""])));const r2s=[["Distribution date","Packing date","#","Product","Criteria","Result"]];S.qc.filter(q=>qcNew(q)&&(!S.qcMonth||(q.date||"").startsWith(S.qcMonth))).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(q=>qcItems(q).forEach((it,i)=>qcRows(it).forEach(([k,r,v])=>r2s.push([q.date,q.pack||"",i+1,it.product,k,v]))));exportXLSX("QC_Reports_"+(S.qcMonth||"all")+".xlsx",r2s.length>1?[["QC reports",rows],["QC form (from 11 Nov)",r2s]]:[["QC reports",rows]],true);return}
  if(t.id==="xlsWtDay"){const d=t.dataset.d,rows=[["Date","Item","Pieces","Waybill kg","Received kg","Returned to supplier kg","Note"]];wtRows(d).forEach(r=>rows.push([d,r.name,r.pcs,r.exp??"",r.in,r.ret,r.note]));exportXLSX("FV_Weights_"+d+".xlsx",[["Weights "+d,rows]],true);return}
  if(t.id==="xlsIss"){const rows=[["Date","School","CERD","Type","Issue","Action taken / solution","Follow-up by","Status","Photos"]];try{for(const i of S.issues)rows.push([i.date,S.schools[i.school]?.en||S.schools[i.school]?.name||"General",i.school?(CERD[i.school]||i.school):"",i.type,i.text,i.fix||"",i.owner,i.status==="closed"?"Closed":"Open",(await recordFiles("issue",i)).length]);exportXLSX("Issues_Log.xlsx",[["Issues",rows]],true)}catch(e){toast("Not downloaded: "+(e.message||e.code))}return}
  if(t.id==="xlsWt"){const rows=[["Date","Item","Waybill kg","Received kg","Returned to supplier kg","Note"]];S.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(w=>{const x=w.code?wtRows(w.date).find(r=>r.k===w.code):null;rows.push([w.date,w.item,x&&x.exp!=null?x.exp:"",w.in??"",x?x.ret:"",w.note||""])});exportXLSX("FV_Weights_Waste_Returns.xlsx",[["Weights",rows]],true);return}

  const ei=t.closest("[data-editiss]");if(ei){const i=S.issues.find(x=>x._id===ei.dataset.editiss);if(!i)return;S.editIss=i._id;
    const setSel=(id,v)=>{const s=$(id);if(v&&![...s.options].some(o=>o.value===v)){const o=document.createElement("option");o.textContent=v;o.value=v;s.appendChild(o)}s.value=v||""};
    $("#i_date").value=i.date||todayISO();$("#i_sq").value="";[...$("#i_school").options].forEach(o=>o.hidden=false);setSel("#i_school",i.school||"");setSel("#i_type",i.type);setSel("#i_owner",i.owner);$("#i_text").value=i.text||"";$("#i_fix").value=i.fix||"";
    $("#i_btn").textContent="Save changes";$("#i_cancel").hidden=false;$("#issForm").scrollIntoView({behavior:"smooth"});return}

  const ti=t.closest("[data-toggleiss]");if(ti){const i=S.issues.find(x=>x._id===ti.dataset.toggleiss);if(!i)return;const st=i.status==="closed"?"open":"closed";i.status=st;render();if(S.db)S.db.collection("issues").doc(i._id).update({status:st,closedAt:st==="closed"?new Date().toISOString():null}).catch(()=>toast("Not saved"));return}
  const dw=t.closest("[data-delwt]");if(dw){if(!dw.dataset.armed){dw.dataset.armed="1";dw.textContent="Sure?";return}const id=dw.dataset.delwt;S.weights=S.weights.filter(w=>w._id!==id);render();if(S.db)S.db.collection("weights").doc(id).delete().catch(()=>toast("Not deleted"));return}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!S.db){toast("Not saved: open the page from claude.ai");return}
  if(e.target.id==="qcForm"){qcSubmit();return}
  if(e.target.id==="issForm"){
    const btn=$("#i_btn"),stat=$("#i_stat");btn.disabled=true;const files=Array.from($("#i_photos")?.files||[]);const photos=[];
    try{
      if(files.length){if(!S.assets)throw{message:"Photo upload not available"};for(const [n,f] of files.entries()){stat.textContent=`Uploading photo ${n+1} of ${files.length}…`;const r=await S.assets.upload(f);photos.push(r.id)}}
      const rec={date:$("#i_date").value,school:$("#i_school").value,type:$("#i_type").value,owner:$("#i_owner").value,text:$("#i_text").value.trim(),fix:$("#i_fix").value.trim()};
      if(S.editIss){const old=S.issues.find(x=>x._id===S.editIss);rec.photos=[...((old&&old.photos)||[]),...photos];rec.editedAt=new Date().toISOString();await S.db.collection("issues").doc(S.editIss).update(rec);S.editIss=null;$("#i_btn").textContent="Log issue";$("#i_cancel").hidden=true;toast("Changes saved")}
      else{await S.db.collection("issues").add(Object.assign(rec,{photos,status:"open",at:new Date().toISOString()}));toast("Issue logged")}
      e.target.reset();$("#i_date").value=todayISO();[...$("#i_school").options].forEach(o=>o.hidden=false);stat.textContent="";
    }catch(err){stat.textContent="Not saved: "+(err.message||err.code)}
    btn.disabled=false;return}
  if(e.target.id==="wtForm"){
    const num=id=>{const v=$(id).value;return v===""?"":Number(v)};
    const w={date:$("#w_date").value,item:$("#w_item").value,in:num("#w_in"),bad:num("#w_bad"),ret:num("#w_ret"),note:$("#w_note").value.trim(),at:new Date().toISOString()};
    if(w.in===""&&w.bad===""&&w.ret===""){toast("Enter at least one weight");return}
    try{await S.db.collection("weights").add(w);["#w_in","#w_bad","#w_ret","#w_note"].forEach(i=>$(i).value="");toast("Weight saved")}catch(err){toast("Not saved: "+(err.message||err.code))}}
});

try{const dd=localStorage.getItem("day");if(dd)S.day=dd}catch(_){}
render();
(async()=>{
  const c=window.claude;
  if(c&&c.use){
    const [db,assets,downloads,user]=await Promise.all([c.use("db"),c.use("assets"),c.use("downloads"),c.use("user")]);
    S.db=db;S.assets=assets;S.downloads=downloads;
    try{S.full=!!(user&&await user.isOwner());if(!S.full&&user){const me=await user.me();S.full=FULL_EMAILS.includes(String(me&&me.email||"").toLowerCase())||!!(await user.canEdit())}}catch(_){S.full=false}
    try{S.canWb=S.full||!!(user&&(await user.can("data.write"))!==false)}catch(_){S.canWb=S.full}
  }else{
    try{
      await loadJs("supabase-config.js",()=>!!window.TD_SUPABASE);
      await loadJs("supabase-runtime.js",()=>!!window.TDStandalone);
      const runtime=await window.TDStandalone($("#view"));
      if(!runtime)return;
      Object.assign(S,runtime);
    }catch(error){
      console.error("Demo initialization failed",error);
      $("#view").textContent="Could not start the demo. Check the Supabase setup and reload.";
      return;
    }
  }
  const db=S.db;
  document.body.classList.toggle("ro",!S.pages&&!S.full);
  if(S.pages)$("#wkBackup").hidden=!S.full||!reportTabs.every(canReadTab);
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===(S.full?S.tab:"wb")));$("#tabs").classList.add("ok");
  if(!db){$("#view").innerHTML=`<div class="empty">Could not reach the data. Sign in to claude.ai and try again.</div>`;return}
  const timer=setTimeout(()=>{if(!S.ready.days)$("#view").innerHTML=`<div class="empty">The data is slow to load. Check the internet.</div>`},10000);
  const sub=(col,fn)=>db.collection(col).onSnapshot(snap=>{fn(snap);S.ready[col]=true;if(col==="days")clearTimeout(timer);render()},err=>{clearTimeout(timer);toast("Loading problem: "+err.code)});
  sub("schools",s=>{S.schools={};s.docs.forEach(d=>S.schools[d.id]=d.data())});
  sub("drivers",s=>{S.drivers={};s.docs.forEach(d=>S.drivers[d.id]=d.data())});
  sub("days",s=>{S.days={};s.docs.forEach(d=>S.days[d.id]=d.data())});
  sub("waybills",s=>{S.wb={};s.docs.forEach(d=>S.wb[d.id]=d.data())});
  if(S.pages||S.full)sub("issues",s=>{S.issues=s.docs.map(d=>Object.assign({_id:d.id},d.data()))});
  if(S.pages||S.full)sub("settings",s=>{const d=s.docs.find(x=>x.id==="po");if(d)S.po=Object.assign({ppk:{}},d.data())});
  if(S.pages||S.full)sub("qc",s=>{S.qc=s.docs.map(d=>Object.assign({_id:d.id},d.data()))});
  if(S.pages||S.full)sub("weights",s=>{S.weights=s.docs.map(d=>Object.assign({_id:d.id},d.data()))});
  sub("subs",s=>{S.subs={};s.docs.forEach(d=>S.subs[d.id]=d.data())});
  if(S.pages||S.full)sub("hygiene",s=>{const m={};s.docs.forEach(x=>{hyHas[x.id]=1;m[x.id]=hyPend[x.id]>0&&S.hyg[x.id]?S.hyg[x.id]:x.data()});Object.keys(hyPend).forEach(k=>{if(hyPend[k]>0&&S.hyg[k]&&!m[k])m[k]=S.hyg[k]});S.hyg=m});
})();
